<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follower Farming & Engagement Exchange</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { color: #333; }
    .card { background: #fafafa; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 6px; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    input, select { padding: 8px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #007bff; color: white; }
    .config-box { background: #e8f4fd; border: 1px solid #b6e0fe; padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Social Media Engagement & Followers Farming</h1>

    <!-- Backend URL Configuration for Cloudflare Pages -->
    <div class="config-box">
      <label for="backendUrlInput"><strong>Backend API URL:</strong></label>
      <input type="text" id="backendUrlInput" value="http://localhost:4000" style="margin-top: 5px; margin-bottom: 5px;">
      <button onclick="saveBackendUrl()" style="padding: 5px 10px; font-size: 12px;">Save URL</button>
    </div>

    <!-- Dashboard -->
    <div class="card">
      <h3>Dashboard (User: <span id="usernameDisplay">Guest</span> | ID: <span id="userIdDisplay">1</span>)</h3>
      <p>Status: <strong>Free Unlimited Mode</strong></p>
      <button onclick="loadUser(1)">Refresh Status</button>
    </div>

    <!-- Campaign Section -->
    <div class="card">
      <h3>Create Follower / Engagement Campaign</h3>
      <form onsubmit="createCampaign(event)">
        <label for="platform">Platform:</label>
        <select id="platform">
          <option value="instagram">Instagram</option>
          <option value="tiktok">TikTok</option>
          <option value="twitter">Twitter / X</option>
          <option value="youtube">YouTube</option>
        </select>
        <label for="targetUrl">Target Profile/Post URL:</label>
        <input type="text" id="targetUrl" placeholder="https://tiktok.com/@username" required>
        <label for="targetCount">Target Follower Count:</label>
        <input type="number" id="targetCount" value="10" min="1" required>
        <button type="submit" id="submitBtn">Launch Campaign (Free)</button>
      </form>
    </div>

    <!-- Tasks Section -->
    <div class="card">
      <h3>Earn Credits (Available Micro-Tasks)</h3>
      <button onclick="loadTasks()">Load Tasks</button>
      <table id="tasksTable">
        <thead>
          <tr><th>ID</th><th>Platform</th><th>Target URL</th><th>Reward</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let BACKEND_URL = localStorage.getItem('backend_url') || (window.location.hostname === 'localhost' ? 'http://localhost:4000' : '');
    document.getElementById('backendUrlInput').value = BACKEND_URL;

    function saveBackendUrl() {
      BACKEND_URL = document.getElementById('backendUrlInput').value.replace(/\/$/, '');
      localStorage.setItem('backend_url', BACKEND_URL);
      alert('Backend URL saved successfully!');
      loadUser(1);
      loadTasks();
    }

    let currentUserId = 1;
    let socket = null;

    async function loadUser(id) {
      if (!BACKEND_URL) return;
      try {
        const res = await fetch(`${BACKEND_URL}/api/users/${id}`);
        const data = await res.json();
        document.getElementById('usernameDisplay').innerText = data.username || 'Guest';
        document.getElementById('userIdDisplay').innerText = data.id || 1;
      } catch (err) {
        console.error(err);
      }
    }

    function initSocket(userId) {
      if (!BACKEND_URL) return;
      if (socket) socket.disconnect();
      try {
        socket = io(BACKEND_URL);
        socket.emit('join_room', userId);
        socket.on('credit_update', (data) => {
          alert(data.message);
          loadTasks();
        });
      } catch (e) {
        console.error('Socket connection error:', e);
      }
    }

    async function loadTasks() {
      if (!BACKEND_URL) {
        alert('Please enter and save your Backend API URL at the top of the page first!');
        return;
      }
      try {
        const res = await fetch(`${BACKEND_URL}/api/tasks/available`);
        const tasks = await res.json();
        const tbody = document.querySelector('#tasksTable tbody');
        tbody.innerHTML = '';
        if (tasks.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No pending tasks available. Create a campaign above to generate tasks!</td></tr>';
          return;
        }
        tasks.forEach(t => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${t.id}</td><td>${t.platform}</td><td><a href="${t.target_url}" target="_blank">View Link</a></td><td>${t.reward} Credits</td><td><button onclick="completeTask(${t.id})">Complete & Earn</button></td>`;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function completeTask(taskId) {
      if (!BACKEND_URL) return;
      try {
        const res = await fetch(`${BACKEND_URL}/api/tasks/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId, workerId: currentUserId })
        });
        const data = await res.json();
        alert(data.message || data.error);
        loadTasks();
      } catch (err) {
        console.error(err);
      }
    }

    async function createCampaign(e) {
      e.preventDefault();
      if (!BACKEND_URL) {
        alert('Please enter and save your Backend API URL at the top of the page first!');
        return;
      }

      const platform = document.getElementById('platform').value;
      const targetUrl = document.getElementById('targetUrl').value;
      const targetCount = parseInt(document.getElementById('targetCount').value);

      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Launching Campaign...';
      btn.disabled = true;

      try {
        const res = await fetch(`${BACKEND_URL}/api/campaigns`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUserId, platform, targetUrl, targetCount })
        });
        const data = await res.json();
        alert(data.message || 'Campaign launched successfully!');
        loadTasks();
      } catch (err) {
        console.error(err);
        alert('Failed to connect to backend. Please verify your Render Backend URL in the box at the top of the page.');
      } finally {
        btn.innerText = 'Launch Campaign (Free)';
        btn.disabled = false;
      }
    }

    // Initialize on load if URL exists
    if (BACKEND_URL) {
      loadUser(currentUserId);
      initSocket(currentUserId);
      loadTasks();
    }
  </script>
</body>
</html>
